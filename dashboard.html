<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Дашборд исследования</title>
<style>
  /* === Шрифты TT Norms Pro Tochka === */
  @font-face {
    font-family: 'TT Norms Pro Tochka';
    src: url('/fonts/TT_Norms_Pro_Tochka_Regular.woff2') format('woff2');
    font-weight: 400; font-style: normal; font-display: swap;
  }
  @font-face {
    font-family: 'TT Norms Pro Tochka';
    src: url('/fonts/TT_Norms_Pro_Tochka_Medium.woff2') format('woff2');
    font-weight: 500; font-style: normal; font-display: swap;
  }
  @font-face {
    font-family: 'TT Norms Pro Tochka';
    src: url('/fonts/TT_Norms_Pro_Tochka_DemiBold.woff2') format('woff2');
    font-weight: 600; font-style: normal; font-display: swap;
  }
  @font-face {
    font-family: 'TT Norms Pro Tochka';
    src: url('/fonts/TT_Norms_Pro_Tochka_Bold.woff2') format('woff2');
    font-weight: 700; font-style: normal; font-display: swap;
  }

  :root {
    --color-primary: #191919;
    --color-secondary: #676767;
    --color-placeholder: #949494;
    --color-brand: #835de1;
    --color-brand-hover: #7249d1;
    --color-white: #ffffff;
    --color-bg-page: #f9f9f9;
    --color-bg-field: rgba(25, 25, 25, 0.05);
    --color-bg-field-hover: rgba(25, 25, 25, 0.08);
    --color-border: rgba(25, 25, 25, 0.08);
    --color-divider: rgba(25, 25, 25, 0.1);
    --radius-s: 8px;
    --radius-m: 12px;
    --radius-l: 16px;
    --radius-xl: 20px;
    --shadow-card: 0px 4px 16px rgba(0, 0, 0, 0.05);
    --shadow-dropdown: 0px 20px 40px rgba(0, 0, 0, 0.1);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'TT Norms Pro Tochka', -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 16px;
    line-height: 1.25;
    color: var(--color-primary);
    background: var(--color-bg-page);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    min-height: 100vh;
  }

  /* === Layout === */
  .layout {
    display: flex;
    width: 100%;
    min-height: 100vh;
  }

  /* === Sidebar === */
  .sidebar {
    width: 280px;
    min-width: 280px;
    display: flex;
    flex-direction: column;
    height: 100vh;
    position: sticky;
    top: 0;
    flex-shrink: 0;
    padding: 0;
    overflow-y: auto;
  }

  .sidebar-top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 40px;
    padding: 14px 20px 14px 32px;
    font-family: 'Geist Mono', 'SF Mono', 'Menlo', monospace;
    font-size: 8px;
    font-weight: 500;
    letter-spacing: 0.28px;
    text-transform: uppercase;
    white-space: nowrap;
    color: #949494;
  }

  .sidebar-logo {
    padding: 12px 20px 8px 34px;
    display: flex;
    align-items: center;
  }

  .sidebar-logo svg {
    height: 31px;
    width: auto;
  }

  .sidebar-nav {
    display: flex;
    flex-direction: column;
    flex: 1;
  }

  .sidebar-menu-group {
    padding: 10px 0 20px;
    margin-left: 20px;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .sidebar-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 12px;
    color: #949494;
    font-size: 14px;
    font-weight: 500;
    line-height: 18px;
    letter-spacing: 0.14px;
    cursor: pointer;
    border: none;
    background: transparent;
    width: 100%;
    text-align: left;
    text-decoration: none;
    transition: background 0.15s, color 0.15s;
    border-radius: var(--radius-s);
  }

  .sidebar-item:hover {
    background: rgba(25, 25, 25, 0.05);
  }

  .sidebar-item.active {
    color: var(--color-brand);
  }

  .sidebar-item-icon {
    width: 24px;
    height: 24px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .sidebar-spacer { flex: 1; }

  .sidebar-bottom {
    padding: 20px 20px 20px 32px;
  }

  .sidebar-back-link {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    font-weight: 500;
    color: var(--color-secondary);
    text-decoration: none;
    transition: color 0.15s;
    padding: 8px 0;
  }

  .sidebar-back-link:hover {
    color: var(--color-brand);
  }

  /* === Main Area === */
  .main-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    padding: 32px 40px;
    min-height: 0;
    max-width: 100%;
  }

  /* === Header === */
  .dash-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 32px;
    flex-wrap: wrap;
    gap: 16px;
  }

  .dash-header-left {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .dash-title {
    font-size: 30px;
    font-weight: 600;
    line-height: 36px;
    letter-spacing: -0.3px;
    color: var(--color-primary);
  }

  .dash-subtitle {
    font-size: 14px;
    font-weight: 400;
    color: var(--color-secondary);
    line-height: 18px;
    letter-spacing: 0.14px;
  }

  .dash-actions {
    display: flex;
    gap: 8px;
  }

  /* === Buttons === */
  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 10px 20px;
    border: none;
    border-radius: var(--radius-m);
    font-family: inherit;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s;
    line-height: 18px;
    letter-spacing: 0.14px;
    white-space: nowrap;
  }

  .btn-primary {
    background: var(--color-brand);
    color: var(--color-white);
  }
  .btn-primary:hover { background: var(--color-brand-hover); }

  .btn-secondary {
    background: var(--color-bg-field);
    color: var(--color-primary);
  }
  .btn-secondary:hover { background: var(--color-bg-field-hover); }

  .btn-danger {
    background: rgba(249, 142, 136, 0.1);
    color: #e74c3c;
  }
  .btn-danger:hover { background: rgba(249, 142, 136, 0.2); }

  .btn-sm {
    padding: 6px 12px;
    font-size: 13px;
    border-radius: var(--radius-s);
  }

  /* === Stat Cards === */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
    gap: 2px;
    border-radius: var(--radius-l);
    overflow: hidden;
    margin-bottom: 24px;
  }

  .stat-card {
    background: var(--color-white);
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .stat-label {
    font-size: 13px;
    font-weight: 500;
    color: var(--color-secondary);
    line-height: 16px;
    letter-spacing: 0.13px;
  }

  .stat-value {
    font-size: 32px;
    font-weight: 600;
    line-height: 38px;
    color: var(--color-primary);
  }
  .stat-value.brand { color: var(--color-brand); }
  .stat-value.green { color: #3F9180; }
  .stat-value.orange { color: #E5952D; }

  /* === Cards === */
  .card {
    background: var(--color-white);
    border-radius: var(--radius-l);
    padding: 24px;
    margin-bottom: 16px;
  }

  .card-title {
    font-size: 18px;
    font-weight: 500;
    line-height: 22px;
    color: var(--color-primary);
    margin-bottom: 16px;
  }

  /* === Data Table === */
  .data-table {
    display: flex;
    flex-direction: column;
    gap: 2px;
    border-radius: var(--radius-m);
    overflow: hidden;
  }

  .data-row {
    display: flex;
    gap: 2px;
    min-height: 52px;
  }

  .data-row.header {
    font-size: 13px;
    font-weight: 500;
    color: var(--color-secondary);
    letter-spacing: 0.13px;
  }

  .data-row.header .data-cell {
    background: rgba(25, 25, 25, 0.07);
    padding: 10px 16px;
    display: flex;
    align-items: center;
  }

  .data-cell {
    background: var(--color-bg-field);
    padding: 12px 16px;
    font-size: 14px;
    display: flex;
    align-items: center;
    color: var(--color-primary);
    line-height: 18px;
    letter-spacing: 0.14px;
  }

  .data-cell.name { font-weight: 500; }

  .col-num { width: 40px; flex-shrink: 0; justify-content: center; }
  .col-name { flex: 2; min-width: 0; }
  .col-grade { width: 80px; flex-shrink: 0; justify-content: center; }
  .col-position { flex: 2; min-width: 0; }
  .col-clicks { width: 70px; flex-shrink: 0; justify-content: center; }
  .col-session { width: 90px; flex-shrink: 0; }
  .col-survey { width: 90px; flex-shrink: 0; justify-content: center; }
  .col-date { width: 130px; flex-shrink: 0; }
  .col-actions { width: 140px; flex-shrink: 0; justify-content: flex-end; gap: 4px; }

  .data-row:not(.header) {
    cursor: pointer;
    transition: filter 0.1s;
  }
  .data-row:not(.header):hover .data-cell {
    background: var(--color-bg-field-hover);
  }

  /* === Badges === */
  .badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 2px 10px;
    border-radius: var(--radius-s);
    font-size: 12px;
    font-weight: 600;
    line-height: 16px;
    letter-spacing: 0.12px;
  }
  .badge-purple { background: rgba(131, 93, 225, 0.1); color: var(--color-brand); }
  .badge-green { background: rgba(63, 145, 128, 0.1); color: #3F9180; }
  .badge-gray { background: var(--color-bg-field); color: var(--color-placeholder); }
  .badge-red { background: rgba(249, 142, 136, 0.1); color: #e74c3c; }

  .click-count { font-weight: 600; color: var(--color-brand); }

  /* === Distribution chips === */
  .distribution-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .dist-chip {
    background: var(--color-bg-field);
    border-radius: var(--radius-m);
    padding: 16px 24px;
    text-align: center;
    min-width: 90px;
  }

  .dist-chip-value {
    font-size: 24px;
    font-weight: 600;
    color: var(--color-brand);
    line-height: 30px;
  }

  .dist-chip-label {
    font-size: 13px;
    color: var(--color-secondary);
    margin-top: 4px;
    line-height: 16px;
  }

  /* === Summary Grid === */
  .summary-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2px;
    border-radius: var(--radius-m);
    overflow: hidden;
  }

  .summary-item {
    background: var(--color-bg-field);
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .summary-label {
    font-size: 12px;
    font-weight: 500;
    color: var(--color-secondary);
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }

  .summary-value {
    font-size: 16px;
    font-weight: 500;
    color: var(--color-primary);
  }

  .summary-value.brand {
    font-size: 28px;
    font-weight: 600;
    color: var(--color-brand);
  }

  /* === Loading === */
  .loading-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 120px 20px;
    gap: 16px;
    color: var(--color-placeholder);
    font-size: 16px;
    font-weight: 500;
  }

  .loading-spinner {
    width: 40px;
    height: 40px;
    border: 3px solid var(--color-border);
    border-top-color: var(--color-brand);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* === Empty state === */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--color-placeholder);
    font-size: 16px;
    background: var(--color-bg-field);
    border-radius: var(--radius-m);
  }

  .empty-icon { font-size: 40px; margin-bottom: 12px; }

  /* === Modal === */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0, 0, 0, 0.4);
    display: flex; align-items: center; justify-content: center;
    z-index: 100; padding: 20px;
    animation: fadeIn 0.15s ease;
  }

  .modal {
    background: var(--color-white);
    border-radius: var(--radius-xl);
    max-width: 700px;
    width: 100%;
    max-height: 85vh;
    overflow-y: auto;
    padding: 32px;
    box-shadow: var(--shadow-dropdown);
    animation: scaleIn 0.2s ease;
  }

  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
  }

  .modal-title {
    font-size: 22px;
    font-weight: 600;
    line-height: 28px;
    color: var(--color-primary);
  }

  .modal-close {
    width: 32px;
    height: 32px;
    border-radius: var(--radius-s);
    border: none;
    background: var(--color-bg-field);
    cursor: pointer;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s;
    flex-shrink: 0;
  }
  .modal-close:hover { background: var(--color-divider); }

  .modal-section {
    margin-top: 20px;
  }

  .modal-section-title {
    font-size: 16px;
    font-weight: 600;
    line-height: 20px;
    color: var(--color-primary);
    margin-bottom: 12px;
  }

  .survey-item {
    background: var(--color-bg-field);
    border-radius: var(--radius-s);
    padding: 14px 16px;
    margin-bottom: 6px;
  }

  .survey-q {
    font-size: 13px;
    color: var(--color-secondary);
    margin-bottom: 4px;
    line-height: 16px;
  }

  .survey-a {
    font-size: 15px;
    font-weight: 500;
    color: var(--color-primary);
    line-height: 20px;
  }

  .click-list {
    max-height: 200px;
    overflow-y: auto;
    background: var(--color-bg-field);
    border-radius: var(--radius-s);
    padding: 12px 16px;
  }

  .click-row {
    display: flex;
    gap: 12px;
    padding: 4px 0;
    border-bottom: 1px solid var(--color-border);
    font-size: 12px;
    color: var(--color-secondary);
    line-height: 18px;
  }
  .click-row:last-child { border-bottom: none; }

  .modal-footer {
    margin-top: 24px;
    padding-top: 20px;
    border-top: 1px solid var(--color-border);
    display: flex;
    justify-content: flex-end;
  }

  /* Confirm */
  .confirm-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5);
    display: flex; align-items: center; justify-content: center;
    z-index: 200; padding: 20px;
    animation: fadeIn 0.15s ease;
  }
  .confirm-box {
    background: var(--color-white);
    border-radius: var(--radius-xl);
    padding: 32px;
    max-width: 400px;
    width: 100%;
    text-align: center;
    box-shadow: var(--shadow-dropdown);
    animation: scaleIn 0.15s ease;
  }
  .confirm-icon { font-size: 40px; margin-bottom: 16px; }
  .confirm-title { font-size: 18px; font-weight: 600; margin-bottom: 8px; color: var(--color-primary); }
  .confirm-text { font-size: 14px; color: var(--color-secondary); margin-bottom: 24px; line-height: 20px; }
  .confirm-actions { display: flex; gap: 12px; justify-content: center; }
  .confirm-actions .btn { min-width: 120px; }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes scaleIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  /* Responsive */
  @media (max-width: 900px) {
    .sidebar { display: none; }
    .main-area { padding: 20px; }
    .summary-grid { grid-template-columns: 1fr; }
    .stats-grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>

    <div class="sidebar-top-bar">
      <span>OOO «Точка»</span>
      <span>Дашборд</span>
    </div>

<script>
const FIREBASE_DB_URL = 'https://datagatetest-4f190-default-rtdb.firebaseio.com';

let participants = [];

async function fetchData() {
  try {
    const res = await fetch(`${FIREBASE_DB_URL}/participants.json`);
    const data = await res.json();
    if (!data) return [];
    return Object.entries(data).map(([key, val]) => ({ ...val, _key: key }));
  } catch (err) {
    console.error('Ошибка загрузки:', err);
    return [];
  }
}

function formatDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
}

function formatDuration(ms) {
  if (!ms) return '0 сек';
  const sec = Math.round(ms / 1000);
  if (sec < 60) return `${sec} сек`;
  return `${Math.floor(sec/60)} мин ${sec%60} сек`;
}

function getStats(data) {
  const total = data.length;
  const withClicks = data.filter(p => p.totalClicks > 0).length;
  const withSurvey = data.filter(p => p.surveyAnswers).length;
  const avgClicks = total > 0 ? Math.round(data.reduce((s, p) => s + (p.totalClicks || 0), 0) / total) : 0;
  const avgDuration = total > 0 ? Math.round(data.reduce((s, p) => s + (p.sessionDuration || 0), 0) / total / 1000) : 0;
  const grades = {};
  data.forEach(p => { grades[p.grade] = (grades[p.grade] || 0) + 1; });
  return { total, withClicks, withSurvey, avgClicks, avgDuration, grades };
}

function getSurveyStats(data) {
  const withSurvey = data.filter(p => p.surveyAnswers);
  if (withSurvey.length === 0) return null;
  const easeValues = withSurvey.map(p => parseInt(p.surveyAnswers?.ease_of_use)).filter(v => !isNaN(v));
  const avgEase = easeValues.length > 0 ? (easeValues.reduce((a,b) => a+b, 0) / easeValues.length).toFixed(1) : '—';
  const aiAttitudes = {};
  withSurvey.forEach(p => {
    const a = p.surveyAnswers?.ai_attitude;
    if (a) aiAttitudes[a] = (aiAttitudes[a] || 0) + 1;
  });
  return { avgEase, aiAttitudes, total: withSurvey.length };
}

function render() {
  const app = document.getElementById('app');
  const stats = getStats(participants);
  const surveyStats = getSurveyStats(participants);

  let html = `
    <div class="dash-header">
      <div class="dash-header-left">
        <h1 class="dash-title">Дашборд исследования</h1>
        <div class="dash-subtitle">Обновлено: ${new Date().toLocaleString('ru-RU')}</div>
      </div>
      <div class="dash-actions">
        <button class="btn btn-secondary" onclick="refreshData()">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M14 8A6 6 0 1 1 8 2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M14 2v4h-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Обновить
        </button>
        <button class="btn btn-primary" onclick="exportCSV()">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 2v8m0 0l3-3m-3 3L5 7" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M2 11v2a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-2" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/></svg>
          Скачать CSV
        </button>
      </div>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Участников</div>
        <div class="stat-value brand">${stats.total}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Прошли тест</div>
        <div class="stat-value green">${stats.withClicks}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Прошли опрос</div>
        <div class="stat-value">${stats.withSurvey}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Ср. кликов</div>
        <div class="stat-value orange">${stats.avgClicks}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Ср. время сессии</div>
        <div class="stat-value">${stats.avgDuration} сек</div>
      </div>
    </div>
  `;

  // Survey summary
  if (surveyStats) {
    html += `
      <div class="card">
        <div class="card-title">Сводка по опроснику · ${surveyStats.total} ответов</div>
        <div class="summary-grid">
          <div class="summary-item">
            <div class="summary-label">Средняя оценка лёгкости (1–7)</div>
            <div class="summary-value brand">${surveyStats.avgEase}/7</div>
          </div>
          <div class="summary-item">
            <div class="summary-label">Отношение к ИИ-генерации</div>
            ${Object.entries(surveyStats.aiAttitudes).map(([k,v]) => `<div style="font-size:14px;margin-top:4px;color:var(--color-primary);"><strong style="color:var(--color-brand);">${v}</strong> — ${k}</div>`).join('')}
          </div>
        </div>
      </div>
    `;
  }

  // Grades distribution
  if (Object.keys(stats.grades).length > 0) {
    html += `
      <div class="card">
        <div class="card-title">Распределение по грейдам</div>
        <div class="distribution-row">
          ${Object.entries(stats.grades).sort((a,b) => b[1]-a[1]).map(([grade, count]) => `
            <div class="dist-chip">
              <div class="dist-chip-value">${count}</div>
              <div class="dist-chip-label">${grade}</div>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  }

  // Participants table
  if (participants.length === 0) {
    html += `
      <div class="card">
        <div class="empty-state">
          <div class="empty-icon">📭</div>
          <div>Пока нет участников</div>
        </div>
      </div>
    `;
  } else {
    html += `
      <div class="card" style="padding: 20px;">
        <div class="card-title" style="padding: 0 4px;">Участники</div>
        <div class="data-table">
          <div class="data-row header">
            <div class="data-cell col-num">№</div>
            <div class="data-cell col-name">Имя</div>
            <div class="data-cell col-grade">Грейд</div>
            <div class="data-cell col-position">Должность</div>
            <div class="data-cell col-clicks">Клики</div>
            <div class="data-cell col-session">Сессия</div>
            <div class="data-cell col-survey">Опрос</div>
            <div class="data-cell col-date">Дата</div>
            <div class="data-cell col-actions"></div>
          </div>
          ${participants.map((p, i) => `
            <div class="data-row" onclick="showDetail(${i})">
              <div class="data-cell col-num" style="color:var(--color-secondary);">${i + 1}</div>
              <div class="data-cell col-name name">Испытуемый №${i + 1}</div>
              <div class="data-cell col-grade"><span class="badge badge-purple">${p.grade || '—'}</span></div>
              <div class="data-cell col-position">${p.position || '—'}</div>
              <div class="data-cell col-clicks"><span class="click-count">${p.totalClicks || 0}</span></div>
              <div class="data-cell col-session" style="color:var(--color-secondary);font-size:13px;">${formatDuration(p.sessionDuration)}</div>
              <div class="data-cell col-survey">${p.surveyAnswers ? '<span class="badge badge-green">✓</span>' : '<span class="badge badge-gray">—</span>'}</div>
              <div class="data-cell col-date" style="color:var(--color-secondary);font-size:13px;">${formatDate(p.registeredAt)}</div>
              <div class="data-cell col-actions" onclick="event.stopPropagation()">
                <button class="btn btn-secondary btn-sm" onclick="showDetail(${i})">Детали</button>
                <button class="btn btn-danger btn-sm" onclick="deleteParticipant(${i})">
                  <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2 4h10M5 4V3a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v1m1.5 0l-.5 7.5a1 1 0 0 1-1 .5H5a1 1 0 0 1-1-.5L3.5 4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
                </button>
              </div>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  }

  app.innerHTML = html;
}

function showDetail(index) {
  const p = participants[index];
  if (!p) return;

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };

  let surveyHtml = '';
  if (p.surveyAnswers) {
    const questions = {
      ease_of_use: 'Насколько легко было создать документ?',
      ai_attitude: 'Отношение к ИИ-генерации',
      llm_usage: 'Использует LLM в работе?',
      improvements: 'Что улучшить?',
      unclear: 'Что было непонятно?',
    };
    surveyHtml = `
      <div class="modal-section">
        <div class="modal-section-title">Ответы опросника</div>
        ${Object.entries(questions).map(([id, q]) => {
          const a = p.surveyAnswers[id];
          if (!a) return '';
          return `<div class="survey-item"><div class="survey-q">${q}</div><div class="survey-a">${a}</div></div>`;
        }).join('')}
      </div>
    `;
  }

  let clicksHtml = '';
  if (p.clickMap && p.clickMap.length > 0) {
    clicksHtml = `
      <div class="modal-section">
        <div class="modal-section-title">Карта кликов · ${p.clickMap.length}</div>
        <div class="click-list">
          ${p.clickMap.slice(0, 50).map((c, i) => `
            <div class="click-row">
              <span style="width:30px;font-weight:600;color:var(--color-primary);">#${i+1}</span>
              <span style="width:70px;">${(c.ts/1000).toFixed(1)}s</span>
              <span style="width:90px;">(${c.x}, ${c.y})</span>
              <span style="flex:1;color:var(--color-primary);">${c.element || ''}</span>
              <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${(c.text || '').slice(0,40)}</span>
            </div>
          `).join('')}
          ${p.clickMap.length > 50 ? `<div style="text-align:center;padding:8px;color:var(--color-placeholder);font-size:12px;">…и ещё ${p.clickMap.length - 50} кликов</div>` : ''}
        </div>
      </div>
    `;
  }

  overlay.innerHTML = `
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title">Испытуемый №${index + 1}</div>
        <button class="modal-close" onclick="this.closest('.modal-overlay').remove()">✕</button>
      </div>

      <div class="summary-grid">
        <div class="summary-item">
          <div class="summary-label">Грейд</div>
          <div class="summary-value">${p.grade || '—'}</div>
        </div>
        <div class="summary-item">
          <div class="summary-label">Должность</div>
          <div class="summary-value">${p.position || '—'}</div>
        </div>
        <div class="summary-item">
          <div class="summary-label">Всего кликов</div>
          <div class="summary-value" style="color:var(--color-brand);font-weight:600;">${p.totalClicks || 0}</div>
        </div>
        <div class="summary-item">
          <div class="summary-label">Длительность сессии</div>
          <div class="summary-value">${formatDuration(p.sessionDuration)}</div>
        </div>
        <div class="summary-item">
          <div class="summary-label">Дата регистрации</div>
          <div class="summary-value">${formatDate(p.registeredAt)}</div>
        </div>
        <div class="summary-item">
          <div class="summary-label">Дата сохранения</div>
          <div class="summary-value">${formatDate(p.savedAt)}</div>
        </div>
      </div>

      ${p.formData ? `
        <div class="summary-grid" style="margin-top:2px;">
          <div class="summary-item">
            <div class="summary-label">Владелец</div>
            <div class="summary-value">${p.formData.owner || '—'}</div>
          </div>
          <div class="summary-item">
            <div class="summary-label">Хранилище</div>
            <div class="summary-value">${p.formData.database || ''} / ${p.formData.schema || ''} / ${p.formData.table || ''}</div>
          </div>
        </div>
      ` : ''}

      ${surveyHtml}
      ${clicksHtml}

      <div class="modal-footer">
        <button class="btn btn-danger" onclick="deleteParticipant(${index})">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2 4h10M5 4V3a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v1m1.5 0l-.5 7.5a1 1 0 0 1-1 .5H5a1 1 0 0 1-1-.5L3.5 4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
          Удалить участника
        </button>
      </div>
    </div>
  `;

  document.body.appendChild(overlay);
}

function exportCSV() {
  if (participants.length === 0) return alert('Нет данных для экспорта');

  const surveyHeaders = ['ease_of_use', 'ai_attitude', 'llm_usage', 'improvements', 'unclear'];
  const headers = ['№', 'Имя', 'Фамилия', 'Грейд', 'Должность', 'Дата', 'Кликов', 'Сессия (сек)', ...surveyHeaders.map(h => 'Опрос: ' + h)];

  const rows = participants.map((p, i) => {
    const sv = surveyHeaders.map(h => `"${String(p.surveyAnswers?.[h] || '').replace(/"/g, '""')}"`);
    return [
      i + 1,
      `"${(p.firstName || '').replace(/"/g, '""')}"`,
      `"${(p.lastName || '').replace(/"/g, '""')}"`,
      `"${(p.grade || '').replace(/"/g, '""')}"`,
      `"${(p.position || '').replace(/"/g, '""')}"`,
      `"${(p.registeredAt || '').replace(/"/g, '""')}"`,
      p.totalClicks || 0,
      p.sessionDuration ? Math.round(p.sessionDuration / 1000) : 0,
      ...sv,
    ].join(',');
  });

  const csv = '\uFEFF' + headers.join(',') + '\n' + rows.join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `research_${new Date().toISOString().slice(0, 10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

function showConfirmModal(name, onConfirm) {
  const overlay = document.createElement('div');
  overlay.className = 'confirm-overlay';
  overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };

  overlay.innerHTML = `
    <div class="confirm-box">
      <div class="confirm-icon">⚠️</div>
      <div class="confirm-title">Удалить участника?</div>
      <div class="confirm-text">Вы собираетесь удалить <strong>${name}</strong>.<br>Это действие нельзя отменить.</div>
      <div class="confirm-actions">
        <button class="btn btn-secondary" id="confirm-cancel">Отмена</button>
        <button class="btn btn-danger" id="confirm-delete">Удалить</button>
      </div>
    </div>
  `;

  document.body.appendChild(overlay);
  overlay.querySelector('#confirm-cancel').onclick = () => overlay.remove();
  overlay.querySelector('#confirm-delete').onclick = async () => {
    overlay.querySelector('#confirm-delete').textContent = 'Удаление…';
    overlay.querySelector('#confirm-delete').disabled = true;
    await onConfirm();
    overlay.remove();
  };
}

function deleteParticipant(index) {
  const p = participants[index];
  if (!p || !p._key) return;
  const name = `Испытуемый №${index + 1}`;

  showConfirmModal(name, async () => {
    try {
      const res = await fetch(`${FIREBASE_DB_URL}/participants/${p._key}.json`, { method: 'DELETE' });
      if (!res.ok) throw new Error(res.statusText);
      participants.splice(index, 1);
      document.querySelectorAll('.modal-overlay').forEach(el => el.remove());
      render();
    } catch (err) {
      alert('Ошибка удаления: ' + err.message);
    }
  });
}

async function refreshData() {
  document.getElementById('app').innerHTML = '<div class="loading-state"><div class="loading-spinner"></div><div>Загрузка…</div></div>';
  participants = await fetchData();
  render();
}

// Init
(async () => {
  participants = await fetchData();
  render();
})();
</script>
